<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 48 48" aria-hidden="true">
  <defs>
    <linearGradient id="shimmerGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f7df1e" />
      <stop offset="50%" stop-color="#ffa500">
        <animate attributeName="offset" values="0%;100%;0%" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f7df1e" />
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;0%;100%" dur="5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect x="6" y="10" width="36" height="6" rx="3" fill="url(#shimmerGradient)" />
  <rect x="6" y="21" width="36" height="6" rx="3" fill="url(#shimmerGradient)" />
  <rect x="6" y="32" width="36" height="6" rx="3" fill="url(#shimmerGradient)" />
</svg>
